name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package & Sign MSIX
        shell: powershell
        run: .\build-msix.ps1 -Arch ${{ matrix.arch }} -SkipCargoBuild

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smart-scheduler-${{ matrix.arch }}
          path: |
            SmartScheduler_*_${{ matrix.arch }}.msix
            SmartScheduler_Cert.cer
            target/${{ matrix.target }}/release/smart-scheduler.exe
